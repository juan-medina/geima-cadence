name: Release

on:
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    prepare:
        name: Prepare tag
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Read version from project.godot
                id: version
                run: |
                    version=$(grep -oP '(?<=^config/version=")[^"]+' src/project.godot)
                    if [ -z "$version" ]; then
                        echo "::error::Could not read config/version from src/project.godot"
                        exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    echo "tag=v$version" >> "$GITHUB_OUTPUT"
                    echo "Releasing v$version"

            -   name: Fail if tag already exists
                run: |
                    tag="${{ steps.version.outputs.tag }}"
                    if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                        echo "::error::Tag $tag already exists. Bump config/version in src/project.godot before releasing."
                        exit 1
                    fi

            -   name: Create and push tag
                run: |
                    tag="${{ steps.version.outputs.tag }}"
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git tag -a "$tag" -m "Release $tag"
                    git push origin "$tag"

    build:
        name: Build ${{ matrix.artifact }}
        needs: prepare
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        artifact: windows-64
                        preset: Windows Desktop 64
                        output: Geima_Cadence.exe
                        archive: zip
                    -   os: windows-latest
                        artifact: windows-32
                        preset: Windows Desktop 32
                        output: Geima_Cadence.exe
                        archive: zip
                    -   os: ubuntu-latest
                        artifact: linux-64
                        preset: Linux 64
                        output: Geima_Cadence.x86_64
                        archive: targz
                    -   os: ubuntu-latest
                        artifact: linux-32
                        preset: Linux 32
                        output: Geima_Cadence.x86_64
                        archive: targz
                    -   os: macos-latest
                        artifact: macos
                        preset: macOS
                        output: Geima_Cadence.zip
                        archive: macoszip
                    -   os: ubuntu-latest
                        artifact: web
                        preset: Web
                        output: index.html
                        archive: zip

        steps:
            -   name: Checkout game
                uses: actions/checkout@v4
                with:
                    lfs: true

            # Checked out by hand rather than submodules:true because the deploy
            # key only authenticates SSH URLs while .gitmodules holds the HTTPS one.
            -   name: Read pinned data revision
                id: pin
                run: echo "sha=$(git rev-parse HEAD:src/data)" >> "$GITHUB_OUTPUT"

            -   name: Checkout data
                uses: actions/checkout@v4
                with:
                    repository: juan-medina/geima-cadence-data
                    ssh-key: ${{ secrets.DATA_REPO_KEY }}
                    ref: ${{ steps.pin.outputs.sha }}
                    lfs: true
                    path: src/data

            -   name: Verify assets
                run: |
                    if grep -rl "^version https://git-lfs" src/data/assets/ 2>/dev/null | grep -q .; then
                        echo "::error::LFS objects were not fetched"
                        exit 1
                    fi

            -   name: Setup Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.x'

            -   name: Stamp build info
                run: python scripts/gen_build_info.py

            -   name: Setup Godot
                uses: chickensoft-games/setup-godot@v2
                with:
                    version: 4.7.1
                    use-dotnet: false
                    include-templates: true
                    cache: true

            -   name: Import project assets
                working-directory: src
                env:
                    GODOT_DISABLE_LEAK_CHECKS: 1
                run: godot --headless --import

            -   name: Export
                working-directory: src
                run: |
                    mkdir -p ../publish/${{ matrix.artifact }}
                    godot --headless --export-release "${{ matrix.preset }}" ../publish/${{ matrix.artifact }}/${{ matrix.output }}

            # Godot never sets the executable bit on Linux exports, and the
            # artifact upload/download round trip below resets permissions to
            # 644 regardless - so packaging (chmod + archive) happens here, in
            # one shot, before this ever becomes a loose file GitHub can touch.
            -   name: Package
                working-directory: publish/${{ matrix.artifact }}
                run: |
                    v="${{ needs.prepare.outputs.version }}"
                    mkdir -p "$GITHUB_WORKSPACE/dist"
                    case "${{ matrix.archive }}" in
                        zip)
                            zip -r "$GITHUB_WORKSPACE/dist/geima-cadence-$v-${{ matrix.artifact }}.zip" .
                            ;;
                        targz)
                            chmod +x "${{ matrix.output }}"
                            tar -czf "$GITHUB_WORKSPACE/dist/geima-cadence-$v-${{ matrix.artifact }}.tar.gz" .
                            ;;
                        macoszip)
                            cp "${{ matrix.output }}" "$GITHUB_WORKSPACE/dist/geima-cadence-$v-${{ matrix.artifact }}.zip"
                            ;;
                        *)
                            echo "::error::Unknown archive type: ${{ matrix.archive }}"
                            exit 1
                            ;;
                    esac

            -   name: Upload artifact
                uses: actions/upload-artifact@v4
                with:
                    name: ${{ matrix.artifact }}
                    path: dist
                    if-no-files-found: error

    release:
        name: GitHub Release
        needs: [prepare, build]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Download packaged builds
                uses: actions/download-artifact@v4
                with:
                    path: dist
                    merge-multiple: true

            -   name: Create release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    v="${{ needs.prepare.outputs.version }}"
                    tag="${{ needs.prepare.outputs.tag }}"
                    gh release create "$tag" \
                        -t "$tag" \
                        -F release-notes.md \
                        "dist/geima-cadence-$v-windows-64.zip" \
                        "dist/geima-cadence-$v-windows-32.zip" \
                        "dist/geima-cadence-$v-linux-64.tar.gz" \
                        "dist/geima-cadence-$v-linux-32.tar.gz" \
                        "dist/geima-cadence-$v-macos.zip"

    itch:
        name: itch.io ${{ matrix.channel }}
        needs: [prepare, build]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   artifact: windows-64
                        channel: windows-64
                        ext: zip
                    -   artifact: windows-32
                        channel: windows-32
                        ext: zip
                    -   artifact: linux-64
                        channel: linux-64
                        ext: tar.gz
                    -   artifact: linux-32
                        channel: linux-32
                        ext: tar.gz
                    -   artifact: macos
                        channel: mac
                        ext: zip
                    -   artifact: web
                        channel: web
                        ext: zip

        steps:
            -   name: Download packaged builds
                uses: actions/download-artifact@v4
                with:
                    path: dist
                    merge-multiple: true

            -   name: Install butler
                run: |
                    curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
                    unzip butler.zip
                    chmod +x butler
                    ./butler -V

            -   name: Push to itch.io
                env:
                    BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
                run: |
                    v="${{ needs.prepare.outputs.version }}"
                    file="dist/geima-cadence-$v-${{ matrix.artifact }}.${{ matrix.ext }}"
                    if [ "${{ matrix.channel }}" = "web" ]; then
                        # itch serves the browser build from index.html at the build
                        # root, and butler uploads a zip as a single file without
                        # unpacking it, so push the unpacked folder instead.
                        mkdir -p web_build
                        unzip -q "$file" -d web_build
                        ./butler push web_build juanmedina/geima-cadence:web --userversion "$v"
                    else
                        ./butler push "$file" juanmedina/geima-cadence:${{ matrix.channel }} --userversion "$v"
                    fi
