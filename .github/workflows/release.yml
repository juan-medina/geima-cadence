name: Release

on:
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    prepare:
        name: Prepare tag
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Read version from project.godot
                id: version
                run: |
                    version=$(grep -oP '(?<=^config/version=")[^"]+' src/project.godot)
                    if [ -z "$version" ]; then
                        echo "::error::Could not read config/version from src/project.godot"
                        exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    echo "tag=v$version" >> "$GITHUB_OUTPUT"
                    echo "Releasing v$version"

            -   name: Fail if tag already exists
                run: |
                    tag="${{ steps.version.outputs.tag }}"
                    if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                        echo "::error::Tag $tag already exists. Bump config/version in src/project.godot before releasing."
                        exit 1
                    fi

            -   name: Create and push tag
                run: |
                    tag="${{ steps.version.outputs.tag }}"
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git tag -a "$tag" -m "Release $tag"
                    git push origin "$tag"

    build:
        name: Build ${{ matrix.artifact }}
        needs: prepare
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        artifact: windows
                        preset: Windows Desktop
                        output: Geima_Cadence.exe
                    -   os: ubuntu-latest
                        artifact: linux
                        preset: Linux
                        output: Geima_Cadence.x86_64
                    -   os: macos-latest
                        artifact: macos
                        preset: macOS
                        output: Geima_Cadence.zip
                    -   os: ubuntu-latest
                        artifact: web
                        preset: Web
                        output: index.html

        steps:
            -   name: Checkout game
                uses: actions/checkout@v4
                with:
                    lfs: true

            # Checked out by hand rather than submodules:true because the deploy
            # key only authenticates SSH URLs while .gitmodules holds the HTTPS one.
            -   name: Read pinned data revision
                id: pin
                run: echo "sha=$(git rev-parse HEAD:src/data)" >> "$GITHUB_OUTPUT"

            -   name: Checkout data
                uses: actions/checkout@v4
                with:
                    repository: juan-medina/geima-cadence-data
                    ssh-key: ${{ secrets.DATA_REPO_KEY }}
                    ref: ${{ steps.pin.outputs.sha }}
                    lfs: true
                    path: src/data

            -   name: Verify assets
                run: |
                    if grep -rl "^version https://git-lfs" src/data/assets/ 2>/dev/null | grep -q .; then
                        echo "::error::LFS objects were not fetched"
                        exit 1
                    fi

            -   name: Setup Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.x'

            -   name: Stamp build info
                run: python scripts/gen_build_info.py

            -   name: Setup Godot
                uses: chickensoft-games/setup-godot@v2
                with:
                    version: 4.7.1
                    use-dotnet: false
                    include-templates: true
                    cache: true

            -   name: Import project assets
                working-directory: src
                env:
                    GODOT_DISABLE_LEAK_CHECKS: 1
                run: godot --headless --import

            -   name: Export
                working-directory: src
                run: |
                    mkdir -p ../publish/${{ matrix.artifact }}
                    godot --headless --export-release "${{ matrix.preset }}" ../publish/${{ matrix.artifact }}/${{ matrix.output }}

            -   name: Upload build artifact
                uses: actions/upload-artifact@v4
                with:
                    name: ${{ matrix.artifact }}
                    path: publish/${{ matrix.artifact }}
                    if-no-files-found: error

    package:
        name: Package
        needs: [prepare, build]
        runs-on: ubuntu-latest
        steps:
            -   name: Download build artifacts
                uses: actions/download-artifact@v4
                with:
                    path: publish

            -   name: Zip builds
                run: |
                    v="${{ needs.prepare.outputs.version }}"
                    mkdir -p dist
                    (cd publish/windows && zip -r "$GITHUB_WORKSPACE/dist/geima-cadence-$v-windows.zip" .)
                    (cd publish/linux   && zip -r "$GITHUB_WORKSPACE/dist/geima-cadence-$v-linux.zip" .)
                    (cd publish/web     && zip -r "$GITHUB_WORKSPACE/dist/geima-cadence-$v-web.zip" .)
                    cp publish/macos/Geima_Cadence.zip "dist/geima-cadence-$v-macos.zip"
                    ls -la dist

            -   name: Upload packaged builds
                uses: actions/upload-artifact@v4
                with:
                    name: dist
                    path: dist
                    if-no-files-found: error

    release:
        name: GitHub Release
        needs: [prepare, package]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Download packaged builds
                uses: actions/download-artifact@v4
                with:
                    name: dist
                    path: dist

            -   name: Create release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    v="${{ needs.prepare.outputs.version }}"
                    tag="${{ needs.prepare.outputs.tag }}"
                    gh release create "$tag" \
                        -t "$tag" \
                        -F release-notes.md \
                        "dist/geima-cadence-$v-windows.zip" \
                        "dist/geima-cadence-$v-linux.zip" \
                        "dist/geima-cadence-$v-macos.zip"

    itch:
        name: itch.io ${{ matrix.channel }}
        needs: [prepare, package]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   plat: windows
                        channel: windows
                    -   plat: linux
                        channel: linux
                    -   plat: macos
                        channel: mac
                    -   plat: web
                        channel: web

        steps:
            -   name: Download packaged builds
                uses: actions/download-artifact@v4
                with:
                    name: dist
                    path: dist

            -   name: Install butler
                run: |
                    curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
                    unzip butler.zip
                    chmod +x butler
                    ./butler -V

            -   name: Push to itch.io
                env:
                    BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
                run: |
                    v="${{ needs.prepare.outputs.version }}"
                    zip="dist/geima-cadence-$v-${{ matrix.plat }}.zip"
                    if [ "${{ matrix.channel }}" = "web" ]; then
                        # itch serves the browser build from index.html at the build
                        # root, and butler uploads a zip as a single file without
                        # unpacking it, so push the unpacked folder instead.
                        mkdir -p web_build
                        unzip -q "$zip" -d web_build
                        ./butler push web_build juanmedina/geima-cadence:web --userversion "$v"
                    else
                        ./butler push "$zip" juanmedina/geima-cadence:${{ matrix.channel }} --userversion "$v"
                    fi
